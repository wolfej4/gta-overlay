name: Render native OBS Stinger
on:
  push:
    branches: [main]
    paths:
      - scripts/generate-stinger.js
      - package.json
      - .github/workflows/native-stinger.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Render transparent WebM with ffmpeg
        run: npm run build:stinger
      - name: Verify alpha channel, dimensions and frame count
        run: |
          file=public/assets/stingers/vice-red-stinger.webm
          test -s "$file"
          ffprobe -v error -show_entries stream_tags=alpha_mode -of default=noprint_wrappers=1 "$file" | grep -q 'alpha_mode=1'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")" = "1080"
          test "$(ffprobe -v error -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$file")" = "48"
      - name: Publish downloadable Stinger into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/stingers/vice-red-stinger.webm
          if git diff --cached --quiet; then
            echo "Asset already matches checked-in media"
            exit 0
          fi
          git commit -m "asset: bundle generated native OBS Stinger video [skip version]"
          git push origin HEAD:main
