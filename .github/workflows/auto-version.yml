name: Auto-increment application version
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: vice-after-dark-versioning
  cancel-in-progress: false

jobs:
  bump-patch:
    if: "!contains(github.event.head_commit.message, '[skip version]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Increase patch version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(pkg.version);
          if (!match) throw new Error('Expected a three-part semantic version, got: ' + pkg.version);
          pkg.version = [match[1], match[2], Number(match[3]) + 1].join('.');
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          console.log('New version:', pkg.version);
          NODE
      - name: Commit and push new version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VERSION="$(node -p "require('./package.json').version")"
          git add package.json
          git commit -m "chore: bump version to v${VERSION} [skip version]"
          git push origin HEAD:main
