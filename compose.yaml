services:
  vice-after-dark:
    build: .
    container_name: vice-after-dark
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: "SET_A_LONG_RANDOM_PASSWORD"
      PORT: "8787"
      # Optional integrations (provide values in local .env / Dockhand secrets)
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID:-}"
      TWITCH_CLIENT_SECRET: "${TWITCH_CLIENT_SECRET:-}"
      TWITCH_REDIRECT_URI: "${TWITCH_REDIRECT_URI:-}"
      OBS_WS_URL: "${OBS_WS_URL:-}"
      OBS_WS_PASSWORD: "${OBS_WS_PASSWORD:-}"
    ports:
      - "${OVERLAY_HOST_PORT:-18787}:8787"
    volumes:
      - vice-overlay-data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  vice-overlay-data:
